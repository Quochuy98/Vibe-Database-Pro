[graph]
all-features = true
targets = ["aarch64-apple-darwin"]

[advisories]
unmaintained = "workspace"
yanked = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    { crate = "sha3@0.11.0", reason = "ml-kem 0.3.2 has not converged on russh's sha3 0.12 line" },
    { crate = "syn@2.0.119", reason = "russh's delegate/enum-dispatch macros have not converged on the workspace syn 3 line" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
