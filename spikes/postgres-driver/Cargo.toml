[package]
name = "dataforge_postgres_spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
futures-util = { version = "=0.3.33", default-features = false, features = ["std"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "=0.7.18", features = ["with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["ring"] }
uuid = "=1.24.0"

[profile.release]
debug = 1
lto = "thin"
